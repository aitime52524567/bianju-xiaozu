<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>网剧编剧制作小组 · 协作工作台</title>
  <meta name="theme-color" content="#5b5bd6" />
  <meta name="description" content="网剧编剧制作小组协作工作台：成员、剧本、分集大纲、人物小传、审核流程、公告待办。" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="编剧小组" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">🎬</div>
        <div class="brand-text">
          <div class="brand-name">编剧制作小组</div>
          <div class="brand-sub">Web Drama Writers' Room</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item active" data-view="dashboard">
          <span class="nav-icon">📊</span><span>工作台概览</span>
        </a>
        <a class="nav-item" data-view="members">
          <span class="nav-icon">👥</span><span>成员管理</span>
        </a>
        <a class="nav-item" data-view="scripts">
          <span class="nav-icon">📚</span><span>剧本库</span>
        </a>
        <a class="nav-item" data-view="episodes">
          <span class="nav-icon">🗂️</span><span>分集大纲</span>
        </a>
        <a class="nav-item" data-view="characters">
          <span class="nav-icon">🎭</span><span>人物小传</span>
        </a>
        <a class="nav-item" data-view="workflow">
          <span class="nav-icon">⚙️</span><span>工作流</span>
        </a>
        <a class="nav-item" data-view="reviews">
          <span class="nav-icon">✅</span><span>审核流程</span>
          <span class="nav-badge" id="navBadgeReviews" hidden></span>
        </a>
        <a class="nav-item" data-view="announcements">
          <span class="nav-icon">📢</span><span>公告与待办</span>
          <span class="nav-badge" id="navBadgeTodos" hidden></span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sync-status" id="syncStatus">🔌 单机模式</div>
        <button class="btn btn-ghost btn-block" id="btnReset">恢复演示数据</button>
      </div>
    </aside>

    <!-- 主内容 -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 class="page-title" id="pageTitle">工作台概览</h1>
          <p class="page-desc" id="pageDesc">网剧编剧制作小组的协作总览</p>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>

      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- 模态框 -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
